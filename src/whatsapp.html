<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Channel - ICSF</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/components/site-header.ts"></script>
    <script type="module" src="/components/site-nav.ts"></script>
    <script type="module" src="/components/site-footer.ts"></script>
</head>
<body>
    <site-header subtitle="WhatsApp Channel"></site-header>
    <site-nav></site-nav>

    <main>
       <form
            id="joinForm"
            action="https://verify-icsf.shriyasistla11.workers.dev"
            method="post">

            <div
                class="cf-turnstile"
                data-sitekey="0x4AAAAAAEfhPGq7Mae2tV9L"
                data-callback="onSuccess">
            </div>
        
            <input
                id="turnstileToken"
                name="turnstileToken"
                type="hidden">
        
            <button
                id="joinBtn"
                type="submit"
                hidden
                style="height:60px;width:200px;background-color:rgba(127, 255, 185, 0.543)">
                Join WhatsApp Channel
            </button>
        </form>
    </main>

    <site-footer></site-footer>

    <script>
        function onSuccess(token) {
            document.getElementById("turnstileToken").value = token;
            document.getElementById("joinBtn").hidden = false;
        }
    </script>
</body>
</html>
